<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Burwell EDM Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --blue:#0884b5;
    --blue-dark:#066a92;
    --ink:#1a1a1a;
    --muted:#666;
    --border:#e2e2e2;
    --bg:#f4f4f4;
    --ok:#1e8e3e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Manrope','-apple-system',BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .topbar{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar h1{
    font-size:17px;
    margin:0;
    color:var(--ink);
  }
  .topbar h1 span{ color:var(--blue); }
  .topbar .actions{ display:flex; gap:10px; }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    padding:10px 16px;
    transition:opacity .15s;
  }
  button:hover{ opacity:0.88; }
  button:active{ opacity:0.75; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-secondary{ background:#fff; color:var(--blue); border:1.5px solid var(--blue); }
  .btn-secondary.copied{ background:var(--ok); color:#fff; border-color:var(--ok); }

  .layout{
    display:flex;
    height:calc(100vh - 61px);
  }
  .form-panel{
    width:46%;
    max-width:640px;
    overflow-y:auto;
    padding:24px;
    border-right:1px solid var(--border);
  }
  .preview-panel{
    flex:1;
    background:#dedede;
    display:flex;
    flex-direction:column;
  }
  .preview-header{
    padding:10px 20px;
    background:#fff;
    border-bottom:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .preview-header b{ color:var(--ink); }
  iframe{
    flex:1;
    border:none;
    width:100%;
  }

  .section-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .section-head{
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fafafa;
    border-bottom:1px solid var(--border);
  }
  .section-head .title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-head .badge{
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--blue);
    background:#e8f4fa;
    border-radius:20px;
    padding:2px 9px;
  }
  .toggle-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    user-select:none;
  }
  .switch{
    position:relative;
    width:38px;
    height:21px;
    flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0;
    background:#ccc;
    border-radius:20px;
    cursor:pointer;
    transition:.15s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:15px; width:15px;
    left:3px; top:3px;
    background:#fff;
    border-radius:50%;
    transition:.15s;
  }
  input:checked + .slider{ background:var(--blue); }
  input:checked + .slider:before{ transform:translateX(17px); }

  .section-body{
    padding:16px 18px 18px 18px;
  }
  .section-body.disabled{
    opacity:0.4;
    pointer-events:none;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input[type=text], .field textarea{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
    resize:vertical;
  }
  .field input[type=text]:focus, .field textarea:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(8,132,181,0.12);
  }
  .field textarea{ min-height:56px; }
  .field .hint{
    font-size:11px;
    color:#999;
    margin-top:4px;
  }
  .field .hint code{
    background:#f0f0f0;
    padding:1px 4px;
    border-radius:3px;
    font-size:10.5px;
  }
  .image-field-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .thumb{
    width:64px;
    height:64px;
    flex-shrink:0;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fafafa;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .thumb-placeholder{
    font-size:9px;
    color:#bbb;
    text-align:center;
    padding:4px;
    line-height:1.3;
  }
  .image-field-controls{
    flex:1;
    min-width:0;
  }
  .image-field-buttons{
    margin-top:6px;
  }
  .btn-choose{
    background:#fff;
    color:var(--blue);
    border:1px solid var(--blue);
    padding:6px 12px;
    font-size:12px;
    border-radius:5px;
    font-weight:600;
  }
  .locked-note{
    padding:14px 18px;
    font-size:12.5px;
    color:var(--muted);
    background:#fafafa;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .row2{ display:flex; gap:12px; }
  .row2 .field{ flex:1; }

  .empty-state{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color:#999;
    font-size:13px;
  }

  @media (max-width: 900px){
    .layout{ flex-direction:column; height:auto; }
    .form-panel{ width:100%; max-width:none; border-right:none; border-bottom:1px solid var(--border); }
    .preview-panel{ height:600px; }
  }
</style>
</head>

<!--
  ============================================================
  BURWELL EDM — MASTER TEMPLATE
  ============================================================
  This is the base template for all future Burwell EDMs.

  LOCKED SECTIONS (do not edit per-campaign — same on every EDM):
    - Header (logo + link to burwell.com.au)
    - Social Icons row
    - Footer (company details, unsubscribe/preferences merge tags)

  FILLABLE FIELDS (replace each placeholder below per campaign):

  {{EMAIL_TITLE}}         — <title> tag (browser tab / webmail title,
                             not the inbox subject line)
  {{SUBJECT_LINE}}        — reference only, see note below
  {{PREVIEW_TEXT}}        — hidden preheader snippet, see note below

  IMPORTANT — SUBJECT LINE & PREVIEW TEXT:
  Campaign Monitor has its own dedicated Subject Line and Preview
  Text fields in the campaign builder (outside this HTML file) —
  those are what recipients actually see, and take priority.
  {{SUBJECT_LINE}} is not read by Campaign Monitor from this file;
  it's included here purely as a reference value so whoever (or
  whatever app) fills in this template also has it on hand to
  paste into Campaign Monitor's Subject field directly — unless
  the app creates campaigns via Campaign Monitor's API, in which
  case it can set the Subject field programmatically from the same
  source value.
  {{PREVIEW_TEXT}} DOES do something on its own: it populates a
  hidden preheader snippet at the top of the email body, which
  many inbox clients fall back to if Campaign Monitor's own
  Preview Text field is left blank. Fill both the same way to be
  safe — Campaign Monitor's field for what recipients see, and
  this token as a backstop.

  Hero section:
    {{HERO_HEADLINE}}      — main H1 headline
    {{HERO_SUBTEXT}}       — supporting paragraph under the headline
    {{HERO_CTA_TEXT}}      — hero CTA button label
    {{HERO_CTA_URL}}       — hero CTA button + hero image link target
    {{HERO_IMAGE_SRC}}     — hero image filename/path
    {{HERO_IMAGE_ALT}}     — hero image alt/title text

  Content Block 1, 2, 3 (repeat the same pattern for each):
    {{BLOCK1_HEADLINE}}    {{BLOCK2_HEADLINE}}    {{BLOCK3_HEADLINE}}
    {{BLOCK1_SUBTEXT}}     {{BLOCK2_SUBTEXT}}     {{BLOCK3_SUBTEXT}}
    {{BLOCK1_IMAGE_SRC}}   {{BLOCK2_IMAGE_SRC}}   {{BLOCK3_IMAGE_SRC}}
    {{BLOCK1_IMAGE_ALT}}   {{BLOCK2_IMAGE_ALT}}   {{BLOCK3_IMAGE_ALT}}
    {{BLOCK1_CTA_TEXT}}    {{BLOCK2_CTA_TEXT}}    {{BLOCK3_CTA_TEXT}}
    {{BLOCK1_CTA_URL}}     {{BLOCK2_CTA_URL}}     {{BLOCK3_CTA_URL}}
    (CTA_URL is reused for that block's image link, so button and
    image click through to the same place.)

  NEED MORE OR FEWER THAN 3 CONTENT BLOCKS?
    Each block is a self-contained, repeatable chunk of markup
    (Headline → Subtext → Image → CTA → Spacer). To add a block,
    copy an existing block's full markup (from its opening
    "SECTION:" comment to the SPACER row after its CTA) and
    renumber its tokens (e.g. BLOCK4_...). To remove a block,
    delete that same chunk entirely, including its trailing spacer.

  PLACEHOLDER SYNTAX: double curly braces around a field name,
  e.g. HERO_HEADLINE wrapped in {{ and }} — chosen as the most
  widely-supported convention. If the filling app expects a
  different syntax (e.g. square brackets), do a straightforward
  find/replace across this file to convert.
  ============================================================
-->

function fieldHTML(f){
  if (f.type === "image") {
    return `
      <div class="field">
        <label for="fld_${f.key}">${f.label}</label>
        <div class="image-field-row">
          <div class="thumb" id="thumb_${f.key}">
            <span class="thumb-placeholder">No image selected</span>
          </div>
          <div class="image-field-controls">
            <input type="text" id="fld_${f.key}" data-key="${f.key}" placeholder="${f.placeholder || ''}">
            <div class="image-field-buttons">
              <button type="button" class="btn-choose" id="choose_${f.key}">Choose Image…</button>
              <input type="file" accept="image/*" id="file_${f.key}" style="display:none;">
            </div>
            <div class="hint">Assumes the file lives in this campaign's <code>images/</code> folder — picking a file just fills in the filename.</div>
          </div>
        </div>
      </div>`;
  }
  const tag = f.type === "textarea" ? "textarea" : "input";
  const typeAttr = f.type === "textarea" ? "" : `type="text"`;
  return `
    <div class="field">
      <label for="fld_${f.key}">${f.label}</label>
      ${tag === "textarea"
        ? `<textarea id="fld_${f.key}" data-key="${f.key}" placeholder="${f.placeholder || ''}"></textarea>`
        : `<input ${typeAttr} id="fld_${f.key}" data-key="${f.key}" placeholder="${f.placeholder || ''}">`
      }
    </div>`;
}

function buildCard({ title, badge, fields, toggleKey, lockedNote }){
  const card = document.createElement("div");
  card.className = "section-card";

  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = `
    <div class="title">${title} ${badge ? `<span class="badge">${badge}</span>` : ""}</div>
    ${toggleKey ? `
      <div class="toggle-wrap">
        <span id="toggleLabel_${toggleKey}">Included</span>
        <label class="switch">
          <input type="checkbox" id="toggle_${toggleKey}" checked>
          <span class="slider"></span>
        </label>
      </div>` : ""}
  `;
  card.appendChild(head);

  if (lockedNote) {
    const note = document.createElement("div");
    note.className = "locked-note";
    note.innerHTML = lockedNote;
    card.appendChild(note);
  } else {
    const body = document.createElement("div");
    body.className = "section-body";
    body.id = toggleKey ? `body_${toggleKey}` : undefined;
    body.innerHTML = fields.map(fieldHTML).join("");
    card.appendChild(body);
  }

  return card;
}

  "HERO_IMAGE_SRC", "BLOCK1_IMAGE_SRC", "BLOCK2_IMAGE_SRC", "BLOCK3_IMAGE_SRC"
];

IMAGE_FIELD_KEYS.forEach(key => {
  const chooseBtn = document.getElementById(`choose_${key}`);
  const fileInput = document.getElementById(`file_${key}`);
  const textInput = document.getElementById(`fld_${key}`);
  const thumb = document.getElementById(`thumb_${key}`);
  if (!chooseBtn || !fileInput || !textInput || !thumb) return;

  chooseBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    // Keep the actual File object so it can be included in the images ZIP
    state.selectedFiles[key] = file;

    // Fill the text field with the images/ path convention
    const path = `images/${file.name}`;
    textInput.value = path;
    state.values[key] = path;
    renderPreview();

    // Show a thumbnail preview from the local file
    const reader = new FileReader();
    reader.onload = (e) => {
      thumb.innerHTML = `<img src="${e.target.result}" alt="">`;
    };
    reader.readAsDataURL(file);
  });
});

  const body = document.getElementById(`body_${n}`);
  const label = document.getElementById(`toggleLabel_${n}`);
  toggle.addEventListener("change", () => {
    state.blockEnabled[n] = toggle.checked;
    body.classList.toggle("disabled", !toggle.checked);
    label.textContent = toggle.checked ? "Included" : "Hidden";
    renderPreview();
  });
});

// ---------- Generation logic ----------
function generateHTML(){
  let html = MASTER_TEMPLATE;

  // Remove disabled blocks entirely (markers + content)
  [1, 2, 3].forEach(n => {
    const startTag = `<!-- BLOCK${n}_START -->`;
    const endTag = `<!-- BLOCK${n}_END -->`;
    if (!state.blockEnabled[n]) {
      const startIdx = html.indexOf(startTag);
      const endIdx = html.indexOf(endTag);
      if (startIdx !== -1 && endIdx !== -1) {
        html = html.slice(0, startIdx) + html.slice(endIdx + endTag.length);
      }
    } else {
      html = html.split(startTag).join("").split(endTag).join("");
    }
  });

  // Replace all remaining {{TOKENS}} with entered values (blank if empty)
  html = html.replace(/\{\{([A-Z0-9_]+)\}\}/g, (match, key) => {
    return (state.values[key] !== undefined && state.values[key] !== "")
      ? state.values[key]
      : "";
  });

  return html;
}

function renderPreview(){
  const html = generateHTML();
  const frame = document.getElementById("previewFrame");
  frame.srcdoc = html;

  const activeBlocks = [1,2,3].filter(n => state.blockEnabled[n]).length;
  document.getElementById("previewMeta").textContent = `${activeBlocks} of 3 content blocks included`;
}

// ---------- Copy / Download ----------
document.getElementById("copyBtn").addEventListener("click", async () => {
  const html = generateHTML();
  try {
    await navigator.clipboard.writeText(html);
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1600);
  } catch (e) {
    alert("Couldn't copy automatically — please select and copy manually.");
  }
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const html = generateHTML();
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const titleVal = (state.values.EMAIL_TITLE || "burwell-edm").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  a.href = url;
  a.download = `${titleVal || "burwell-edm"}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("downloadImagesBtn").addEventListener("click", async () => {
  const btn = document.getElementById("downloadImagesBtn");

  // Only include images for sections actually in the final email:
  // Hero always, each Content Block only if its toggle is switched on.
  const activeKeys = ["HERO_IMAGE_SRC"];
  [1, 2, 3].forEach(n => {
    if (state.blockEnabled[n]) activeKeys.push(`BLOCK${n}_IMAGE_SRC`);
  });

  const filesToZip = activeKeys
    .map(key => state.selectedFiles[key])
    .filter(Boolean);

  if (filesToZip.length === 0) {
    alert("No images have been chosen via \"Choose Image…\" yet. Pick images using the file picker on each image field first — typed-in paths alone can't be bundled, since the browser only has access to files you've explicitly selected.");
    return;
  }

  const missingCount = activeKeys.length - filesToZip.length;

  btn.disabled = true;
  btn.textContent = "Zipping…";

  try {
    const zip = new JSZip();
    const imagesFolder = zip.folder("images");
    for (const file of filesToZip) {
      const arrayBuffer = await file.arrayBuffer();
      imagesFolder.file(file.name, arrayBuffer);
    }

    const zipBlob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    const titleVal = (state.values.EMAIL_TITLE || "burwell-edm").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    a.href = url;
    a.download = `${titleVal || "burwell-edm"}-images.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    if (missingCount > 0) {
      alert(`Zipped ${filesToZip.length} image(s). Note: ${missingCount} active image field${missingCount > 1 ? "s haven't" : " hasn't"} had a file chosen via the picker yet, so ${missingCount > 1 ? "they're" : "it's"} not included — double check every image field before uploading to Campaign Monitor.`);
    }
  } catch (err) {
    alert("Couldn't build the ZIP: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Download Images (ZIP)";
  }
});

// Initial render
renderPreview();
</script>
